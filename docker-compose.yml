services:
  broker:
    build: .
    command: ["python", "-m", "broker", "--host", "0.0.0.0", "--port", "9092"]
    ports:
      - "9092:9092"
    volumes:
      - ./data:/app/data
      - ./offsets:/app/offsets

  dashboard:
    build: .
    command: ["python", "-m", "dashboard", "--host", "0.0.0.0", "--port", "8000", "--broker-host", "broker", "--broker-port", "9092"]
    ports:
      - "8000:8000"
    depends_on:
      - broker
    volumes:
      - ./data:/app/data
      - ./offsets:/app/offsets
      - ./sessions:/app/sessions
